# dérive – ZimaOS deployment
#
# API and web images are published by .github/workflows/publish-images.yml.
# Before installing, replace every value surrounded by __...__ below.
name: derive

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reado
      POSTGRES_USER: reado
      # Use letters, numbers and hyphens only; it is also part of DATABASE_URL.
      POSTGRES_PASSWORD: "__REPLACE_WITH_A_LONG_DATABASE_PASSWORD__"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reado -d reado"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # Stable host path: survives ZimaOS app recreation and remains visible
      # in Files under /DATA/AppData/derive/postgres.
      - type: bind
        source: /DATA/AppData/derive/postgres
        target: /var/lib/postgresql/data
    networks: [derive]

  api:
    image: ghcr.io/hubertoink/derive-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://reado:__REPLACE_WITH_A_LONG_DATABASE_PASSWORD__@postgres:5432/reado"
      # Do not change this after setup; it encrypts keys stored in PostgreSQL.
      READO_SECRET_KEY: "__REPLACE_WITH_A_LONG_RANDOM_SECRET__"
      DERIVE_BOOTSTRAP_ADMIN_USERNAME: "__YOUR_ADMIN_USERNAME__"
      DERIVE_BOOTSTRAP_ADMIN_EMAIL: "__YOUR_ADMIN_EMAIL__"
      DERIVE_BOOTSTRAP_ADMIN_PASSWORD: "__REPLACE_WITH_A_LONG_ADMIN_PASSWORD__"
      DERIVE_ALLOW_PUBLIC_SIGNUP: "false"
      DERIVE_SESSION_TTL_DAYS: "14"
      DERIVE_INVITE_LIFETIME_HOURS: "48"
      # Set to true only when served via HTTPS through a reverse proxy/domain.
      DERIVE_AUTH_SECURE_COOKIE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [derive]

  worker:
    image: ghcr.io/hubertoink/derive-api:latest
    pull_policy: always
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://reado:__REPLACE_WITH_A_LONG_DATABASE_PASSWORD__@postgres:5432/reado"
      READO_SECRET_KEY: "__REPLACE_WITH_A_LONG_RANDOM_SECRET__"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [derive]

  web:
    image: ghcr.io/hubertoink/derive-web:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      CURATOR_API_URL: "http://api:8000"
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - target: 3000
        published: "${WEBUI_PORT:-3101}"
        protocol: tcp
    networks: [derive]

networks:
  derive:

x-casaos:
  architectures:
    - amd64
  main: web
  author: Hubertoink
  developer: Hubertoink
  category: Utilities
  icon: "https://raw.githubusercontent.com/Hubertoink/derive/main/assets/derive_fordarkmode.png"
  title:
    en_us: "dérive"
  tagline:
    en_us: "Personal reading room and AI curator"
  description:
    en_us: "A private multi-user reading room for long-form articles and podcasts."
  index: /
  port_map: "${WEBUI_PORT:-3101}"
  scheme: http
