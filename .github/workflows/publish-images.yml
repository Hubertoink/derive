name: Publish container images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.component }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/derive-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/derive-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=dérive ${{ matrix.component }}

  make-public:
    name: Make packages public
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set the GHCR package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/user/packages/container/derive-api" -f visibility=public
          gh api --method PATCH "/user/packages/container/derive-web" -f visibility=public
